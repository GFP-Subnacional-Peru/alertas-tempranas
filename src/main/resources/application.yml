spring:
  application:
    name: atd-service
  datasource:
    url: ${ATD_DB_URL:jdbc:postgresql://localhost:5433/atd}
    username: ${ATD_DB_USER:atd}
    password: ${ATD_DB_PASSWORD:atd_local}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      connection-init-sql: SET search_path = atd, public
  flyway:
    enabled: true
    schemas: atd
    default-schema: atd
    create-schemas: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  jackson:
    default-property-inclusion: non_null
  main:
    banner-mode: off

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        name: ATD_SESION
        http-only: true
        same-site: lax
        secure: ${ATD_COOKIE_SEGURA:false}
  compression:
    enabled: true
    mime-types: application/json,application/geo+json
    min-response-size: 2048
  tomcat:
    threads:
      max: 20
  error:
    include-stacktrace: never
    include-message: never

atd:
  reporte:
    responsable: ${ATD_REPORTE_RESPONSABLE:Favio Campos}
    cargo: ${ATD_REPORTE_CARGO:Promotor Ambiental}
    dashboard-url: ${ATD_DASHBOARD_URL:https://acr-dashboard-5iqz.onrender.com/}
  # Un perfil sin clave queda deshabilitado. Las claves nunca van en el repositorio.
  acceso:
    consulta:
      usuario: ${ATD_USUARIO_CONSULTA:usuario1}
      clave: ${ATD_CLAVE_CONSULTA:}
    editor:
      usuario: ${ATD_USUARIO_EDITOR:editor1}
      clave: ${ATD_CLAVE_EDITOR:}
  # Drive empresarial (unidad compartida). Vacío = las fotos siguen en la base.
  drive:
    carpeta: ${ATD_DRIVE_CARPETA:}
    credenciales: ${ATD_DRIVE_CREDENCIALES:}
    refresh: ${ATD_DRIVE_REFRESH_TOKEN:}

logging:
  level:
    root: INFO
    org.springframework.web: WARN
