# Mismo horario laboral de Lima, desfasado unos minutos por si el otro aviso se atrasa.
name: Keep Render awake (offset)

on:
  schedule:
    - cron: "52,57 12 * * 1-5"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 13-22 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping alertas
        run: |
          curl -fsS --max-time 180 "https://acr-atd.onrender.com/api/atd/salud"
